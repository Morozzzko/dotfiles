approvals_reviewer = "user"
approval_policy = "on-request"
default_permissions = "dev"
model = "gpt-5.6-sol"
model_reasoning_effort = "medium"
project_doc_fallback_filenames = ["CLAUDE.md"]

[permissions.dev]
description = "Workspace editing with isolated filesystem access."
extends = ":workspace"

[permissions.dev.filesystem]
":root" = "deny"
":minimal" = "read"
"~/.gitconfig" = "read"
"~/.config/git" = "read"
"~/.ssh/id_ed25519.pub" = "read"
"~/.cache" = "write"
"~/Library/Caches" = "write"
"~/Library/pnpm" = "write"

[permissions.dev.filesystem.":workspace_roots"]
"." = "write"
".git/" = "write"
"**/*.env" = "deny"
"**/*.env.*" = "deny"

[permissions.dev.network]
enabled = false

[plugins."google-calendar@openai-curated"]
enabled = true

[plugins."slack@openai-curated"]
enabled = true

[plugins."documents@openai-primary-runtime"]
enabled = true

[plugins."pdf@openai-primary-runtime"]
enabled = true

[plugins."spreadsheets@openai-primary-runtime"]
enabled = true

[plugins."presentations@openai-primary-runtime"]
enabled = true

[plugins."template-creator@openai-primary-runtime"]
enabled = true

[plugins."sites@openai-bundled"]
enabled = true

[plugins."visualize@openai-bundled"]
enabled = true

[plugins."browser@openai-bundled"]
enabled = true

[plugins."codex-app-tools@openai-bundled"]
enabled = true

[features]
js_repl = false
hooks = true

[[hooks.PreToolUse]]
matcher = "^Bash$"

[[hooks.PreToolUse.hooks]]
type = "command"
command = "python3 ~/.codex/hooks/bash-discipline.py"
timeout = 5
statusMessage = "Checking Bash command discipline"

[desktop]
conversationDetailMode = "STEPS_COMMANDS"
ambient-suggestions-enabled = true
followUpQueueMode = "queue"
